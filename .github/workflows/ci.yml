name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: private/requirements.txt
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r private/requirements.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run private:check
      - run: npm run data:validate
      - run: npm run build
      - run: npm run perf:budget
      - run: npm audit --audit-level=moderate
